# Sonde: lange Geldmengen-Historie fuer USD und NZD - schreibt NICHTS.
# Anlass: Nutzer 2026-11-23 "Find bei nzd und usd Daten die weiter zurueckgehen
# da muss es was geben". Stand: USD 6 Punkte (Jahresrate aus TV-Bestaenden),
# NZD 2 Punkte (TE-Seitentext, RBNZ 403). Aus der Claude-Umgebung sind alle
# Quellen gesperrt - deshalb misst dieser Lauf auf dem GitHub-Laeufer.
# Runde 1 (2026-11-23): FRED vom Laeufer nicht erreichbar (Verbindung 0),
#   RBNZ direkt 403, aber Wayback-Kopien von hc50.xlsx (M1 + Broad money ab
#   12/2016) und hc50-long-run.xlsx (Broad money, 456 Monate); DBnomics IMF
#   NZ Broad money nur 2013-2025.
# Runde 2: Fed-Downloadpaket H.6, DBnomics-Suche (FED/OECD/IMF), Wayback-
#   Dateien ganz auslesen + wie oft das Archiv sie neu sichert.
name: Probe money supply history (USD, NZD)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kandidaten abfragen
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re, io, zipfile, csv, datetime
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          def hol(url, timeout=90):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"}), timeout=timeout)
                  return r.status, r.read(), r.headers.get("content-type", "")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400], ""
              except Exception as e:
                  return 0, str(e).encode()[:300], ""
          # ── USD: Fed Data Download Program, ganzes H.6-Paket ──
          for url in ["https://www.federalreserve.gov/datadownload/Output.aspx?rel=H6&filetype=zip",
                      "https://www.federalreserve.gov/datadownload/Choose.aspx?rel=H6"]:
              code, b, ct = hol(url, 120)
              print(f"=== Fed DDP :: {code} :: {ct} :: {len(b)} Bytes\n    {url}")
              if code == 200 and b[:2] == b"PK":
                  z = zipfile.ZipFile(io.BytesIO(b)); print("    Teile:", z.namelist()[:10])
                  for n in z.namelist():
                      if not n.lower().endswith(".csv"): continue
                      t = z.read(n).decode("utf8", "ignore"); rows = list(csv.reader(io.StringIO(t)))
                      kopf = rows[:6]
                      print(f"    {n}: {len(rows)} Zeilen; Kopf:")
                      for r in kopf: print("      ", [c[:60] for c in r[:8]])
                      daten = [r for r in rows if r and re.match(r"\d{4}-\d{2}", r[0])]
                      if daten: print(f"      Daten {daten[0][0]} .. {daten[-1][0]} ({len(daten)}); erste: {daten[0][:5]} letzte: {daten[-1][:5]}")
                  for n in z.namelist():
                      if n.lower().endswith(".xml") and len(z.read(n)) < 3_000_000:
                          x = z.read(n).decode("utf8", "ignore")
                          print(f"    {n}: Reihen mit M2:", sorted(set(re.findall(r'SERIES_NAME="([^"]*M2[^"]*)"', x)))[:12])
              elif code == 200:
                  t = b.decode("utf8", "ignore")
                  print("    Links:", sorted(set(re.findall(r'(Output\.aspx\?[^"\']{0,200}|Build\.aspx\?[^"\']{0,120}|PackageDownload[^"\']{0,120})', t)))[:12])
          # ── DBnomics: Datensaetze und Reihen suchen ──
          def dbn(path, q=None, dims=None, n=20):
              qs = {"limit": n, "observations": 0}
              if q: qs["q"] = q
              if dims: qs["dimensions"] = json.dumps(dims)
              url = f"https://api.db.nomics.world/v22/series/{path}?" + urllib.parse.urlencode(qs)
              code, b, ct = hol(url)
              print(f"=== DBnomics {path} q={q} dims={dims} :: {code}")
              try:
                  for s in json.loads(b)["series"]["docs"][:n]:
                      print("    ", s.get("series_code"), "|", (s.get("series_name") or "")[:110], "|", s.get("indexed_at", "")[:10])
              except Exception as e:
                  print("    ", b[:200])
          dbn("FED", q="M2")
          dbn("FED/H6", q="M2", n=25)
          dbn("OECD/MEI", q="monetary aggregates", dims={"LOCATION": ["USA", "NZL"]}, n=25)
          dbn("IMF/IFS", q="money", dims={"REF_AREA": ["NZ"]}, n=25)
          dbn("IMF/IFS", q="money", dims={"REF_AREA": ["US"]}, n=25)
          dbn("IMF/MFS", q="broad money", dims={"REF_AREA": ["NZ"]}, n=15)
          # gefundene Kandidaten mit Werten
          def dbw(path):
              url = f"https://api.db.nomics.world/v22/series/{path}?observations=1&format=json"
              code, b, ct = hol(url)
              try:
                  s = json.loads(b)["series"]["docs"][0]; pts = [(p, v) for p, v in zip(s["period"], s["value"]) if v not in (None, "NA")]
                  print(f"=== WERTE {path} :: {len(pts)} :: {pts[0]} .. {pts[-1]}")
              except Exception:
                  print(f"=== WERTE {path} :: {code} :: keine")
          for p in ["OECD/MEI/USA.MABMM201.STSA.M", "OECD/MEI/USA.MABMM201.NCML.M", "OECD/MEI/NZL.MABMM301.STSA.M", "OECD/MEI/NZL.MABMM301.NCML.M",
                    "OECD/MEI/NZL.MABMM301.NCML.Q", "OECD/MEI/NZL.MANMM101.NCML.M", "OECD/KEI/MA.USA.ST.M", "OECD/KEI/MA.NZL.ST.Q"]:
              dbw(p)
          # ── NZD: Wayback-Dateien ganz auslesen ──
          def xlsx_lesen(b):
              z = zipfile.ZipFile(io.BytesIO(b))
              ss = re.findall(r"<si>(.*?)</si>", z.read("xl/sharedStrings.xml").decode("utf8", "ignore"), re.S)
              ss = [re.sub(r"<[^>]+>", "", s) for s in ss]
              x = z.read("xl/worksheets/sheet1.xml").decode("utf8", "ignore")
              zeilen = {}
              for m in re.finditer(r'<c r="([A-Z]+)(\d+)"([^>]*?)(?:/>|>(.*?)</c>)', x, re.S):
                  col, row, attr, inner = m.group(1), int(m.group(2)), m.group(3), m.group(4) or ""
                  v = re.search(r"<v>(.*?)</v>", inner); v = v.group(1) if v else ""
                  if 't="s"' in attr and v != "": v = ss[int(v)]
                  zeilen.setdefault(row, {})[col] = v
              return zeilen
          def xd(v):
              try: return (datetime.date(1899, 12, 30) + datetime.timedelta(days=int(float(v)))).isoformat()[:7]
              except Exception: return v
          for f in ["hc50.xlsx", "hc50-long-run.xlsx"]:
              url = "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/c/c50/" + f
              code, b, ct = hol("http://web.archive.org/cdx/search/cdx?url=" + urllib.parse.quote(url) + "&output=json&fl=timestamp,statuscode,length&filter=statuscode:200")
              try:
                  snaps = json.loads(b)[1:]
              except Exception:
                  snaps = []
              print(f"=== Wayback {f}: {len(snaps)} Sicherungen; letzte 12: {[s[0][:8] for s in snaps[-12:]]}")
              if not snaps: continue
              code, b, ct = hol(f"http://web.archive.org/web/{snaps[-1][0]}id_/{url}", 120)
              try:
                  z = xlsx_lesen(b)
              except Exception as e:
                  print("    nicht lesbar", e); continue
              rows = sorted(z)
              for r in rows[:6]: print("    Kopf", r, {k: v[:50] for k, v in sorted(z[r].items())[:8]})
              daten = [r for r in rows if re.match(r"^\d{4,5}(\.0)?$", z[r].get("A", "")) and int(float(z[r]["A"])) > 20000]
              if daten:
                  a, e = z[daten[0]], z[daten[-1]]
                  print(f"    Daten {xd(a['A'])} .. {xd(e['A'])} ({len(daten)} Monate)")
                  print("    erste:", {k: v[:14] for k, v in sorted(a.items())}, "\n    letzte:", {k: v[:14] for k, v in sorted(e.items())})
          PY
