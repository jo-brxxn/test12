# Sonde: lange Geldmengen-Historie fuer USD und NZD - schreibt NICHTS.
# Anlass: Nutzer 2026-11-23 "Find bei nzd und usd Daten die weiter zurueckgehen
# da muss es was geben". Stand: USD 6 Punkte (Jahresrate aus TV-Bestaenden),
# NZD 2 Punkte (TE-Seitentext, RBNZ 403). Aus der Claude-Umgebung sind alle
# Quellen gesperrt - deshalb misst dieser Lauf auf dem GitHub-Laeufer.
# Runde 1 (2026-11-23): FRED vom Laeufer nicht erreichbar (Verbindung 0),
#   RBNZ direkt 403, aber Wayback-Kopien von hc50.xlsx (M1 + Broad money ab
#   12/2016) und hc50-long-run.xlsx (Broad money, 456 Monate); DBnomics IMF
#   NZ Broad money nur 2013-2025.
# Runde 2 (2026-11-23): Fed-Zip 1,4 MB erreichbar (h6_data.xml), OECD MEI NZ M3
#   1977-03..2018-12 (eingestellt), IMF IFS NZ ab 2013, Wayback long-run =
#   Broad money 1988-03..2025-11, nur ~1 Sicherung/Jahr.
# Runde 2 Plan: Fed-Downloadpaket H.6, DBnomics-Suche (FED/OECD/IMF), Wayback-
#   Dateien ganz auslesen + wie oft das Archiv sie neu sichert.
name: Probe money supply history (USD, NZD)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kandidaten abfragen
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re, io, zipfile, csv, datetime
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          def hol(url, timeout=90):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"}), timeout=timeout)
                  return r.status, r.read(), r.headers.get("content-type", "")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400], ""
              except Exception as e:
                  return 0, str(e).encode()[:300], ""
          # Runde 3: H.6-XML (Aufbau, M2-Reihen, Zahl der Monate) + TE-NZ-Bestand vs RBNZ Broad money
          code, b, ct = hol("https://www.federalreserve.gov/datadownload/Output.aspx?rel=H6&filetype=zip", 120)
          z = zipfile.ZipFile(io.BytesIO(b)); x = z.read("h6_data.xml").decode("utf8", "ignore")
          print("=== H6 XML", len(x), "Zeichen; Anfang:\n", x[:1500])
          reihen = re.findall(r"<kf:Series ([^>]*)>(.*?)</kf:Series>", x, re.S) or re.findall(r"<(?:\w+:)?Series ([^>]*)>(.*?)</(?:\w+:)?Series>", x, re.S)
          print("=== H6 Reihen:", len(reihen))
          for attr, inner in reihen:
              if not re.search(r"M2", attr): continue
              obs = re.findall(r'TIME_PERIOD="([^"]+)"[^>]*OBS_VALUE="([^"]+)"', inner) or re.findall(r'OBS_VALUE="([^"]+)"[^>]*TIME_PERIOD="([^"]+)"', inner)
              print("   ", attr[:260], "::", len(obs), "Werte", obs[:1], "..", obs[-1:])
          code, b, ct = hol("https://tradingeconomics.com/new-zealand/money-supply-m3")
          t = b.decode("utf8", "ignore")
          print("=== TE NZ M3:", re.findall(r'<meta name="description" content="([^"]{0,400})', t)[:1])
          print("    Saetze:", [m[:260] for m in re.findall(r"Money Supply M3 in New Zealand[^<]{0,260}", t)[:3]])
          PY
