# Sonde: Schweizer Lohnindex (jaehrlich) - schreibt NICHTS.
# Anlass: Nutzer 2026-11-22 "Ja bind eine Quelle ein" (CHF Wage Index, Avg Hourly Earnings).
name: Probe CHF wage index
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: BFS PXWeb + Trading Economics
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          P="https://www.pxweb.bfs.admin.ch/api/v1/en"
          CODE=$(curl -sL -o db.json -w "%{http_code}" --max-time 60 "$P" || echo 000); echo "=== PX root $CODE $(wc -c < db.json)"; head -c 600 db.json; echo
          python3 -c "import json;d=json.load(open('db.json'));print([x['dbid'] for x in d if x['dbid'].startswith(('px-x-0304','px-x-0302','px-x-0303'))])"
          for D in $(python3 -c "import json;d=json.load(open('db.json'));print(' '.join(x['dbid'] for x in d if x['dbid'].startswith('px-x-0304')))"); do
            curl -sL -o l.json --max-time 60 "$P/$D" || true
            echo "=== $D"; python3 -c "import json;d=json.load(open('l.json'));[print('   ',x.get('id'),'|',x.get('text')) for x in d]" 2>/dev/null || head -c 300 l.json
          done
          CODE=$(curl -sL -o te.html -w "%{http_code}" --max-time 60 -A "$UA" "https://tradingeconomics.com/switzerland/wage-growth" || echo 000)
          echo "=== TE wage-growth $CODE $(wc -c < te.html)"
          grep -o -E 'Wages? (?:Growth )?in Switzerland[^<]{0,200}|<meta name="description" content="[^"]{0,300}' te.html | head -4
          CODE=$(curl -sL -o te2.html -w "%{http_code}" --max-time 60 -A "$UA" "https://tradingeconomics.com/switzerland/employed-persons" || echo 000)
          echo "=== TE employed-persons $CODE $(wc -c < te2.html)"
          grep -o -E '<meta name="description" content="[^"]{0,300}' te2.html | head -2
