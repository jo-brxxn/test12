name: Waechter

# Laeuft bei jedem Push auf main und jedem Pull Request auf index.html, die
# Module (js/), die Workflows oder die Waechter selbst. Die stuendlichen
# Daten-Commits (nur *.json) loesen ihn NICHT aus - sie aendern keinen Code.
# ⚠ js/** fehlte bis 2026-10-05: seit der Modul-Aufteilung (2026-08-25) liefen
# reine Modul-Aenderungen ungeprueft durch.
#
# Seit 2026-10-24 (Waechter-Ueberholung, Nutzer: "fasse Sachen zusammen
# sodass es effizient ist"):
#  - nur noch main + Pull Requests: jeder Commit lief vorher ZWEIMAL (Session-
#    Branch und main, derselbe Stand, je ~69 min - Laeufe 599/600, 601/602,
#    603/604, 609/610). Gepusht wird ohnehin immer auch auf main (CLAUDE.md
#    Regel 7).
#  - sechs parallele Pakete statt eines Laufs: check/all.js --teil i/6 teilt
#    nach den gemessenen CI-Sekunden (laengste Pruefung zuerst ins kuerzeste
#    Paket). Lauf 608: 68,6 min am Stueck; je Paket jetzt ~10 min.
#  - ein neuer Push bricht den laufenden Lauf ab: es zaehlt nur der neueste
#    Stand von main.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'check/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'check/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: waechter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statisch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # die Regel-Pruefung braucht den Vorher-Stand

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: PyYAML bereitstellen
        run: python3 -m pip install --quiet pyyaml

      - name: Statische Waechter
        run: node check/all.js --static --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}"

  browser:
    name: browser ${{ matrix.teil }}/6
    runs-on: ubuntu-latest
    # Ein Paket ~10 min; der Runner ist 2-3x langsamer als lokal und schwankt -
    # 30 min Grenze laesst Luft, ohne dass ein haengender Lauf eine Stunde frisst.
    timeout-minutes: 30
    strategy:
      fail-fast: false        # alle Pakete zu Ende laufen lassen: jeder rote Fund zaehlt
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # scorediff/summarydiff/rules brauchen den Vorher-Stand

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Chromium fuer die Browser-Waechter
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Testserver starten
        run: |
          nohup python3 -m http.server 8935 --directory . >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8935/index.html; then echo "Server steht."; exit 0; fi
            sleep 1
          done
          echo "Server kam nicht hoch"; exit 1

      - name: Waechter-Paket
        env:
          PW_PATH: playwright
        run: node check/all.js --teil ${{ matrix.teil }}/6 --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}"
