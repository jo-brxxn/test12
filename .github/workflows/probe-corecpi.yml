name: Probe NZ core CPI sources

# Einmal-Probe 2026-10-27, schreibt nichts ins Repo: Aufbau der Stats-NZ-
# Datei "tradeables-and-non-tradeables.csv" (Non-tradables-CPI) und ob das
# Pfadmuster fuer Vorquartale gilt.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Stats NZ CSV
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for Q in "September-2026" "June-2026" "March-2026"; do
            q=$(echo "$Q" | tr 'A-Z' 'a-z')
            U="https://www.stats.govt.nz/assets/Uploads/Consumers-price-index/Consumers-price-index-${Q}-quarter/Download-data/consumers-price-index-${q}-quarter-tradeables-and-non-tradeables.csv"
            curl -sL -A "$UA" -m 30 -o "t_$q.csv" -w "HTTP %{http_code} %{size_download}B $U\n" "$U" || true
          done
          f=t_september-2026.csv
          echo "--- Kopf"; head -4 "$f"
          echo "--- Spalte 1-6 (eindeutig)"; awk -F, 'NR>1{print $2","$3","$4","$5","$6}' "$f" | sort | uniq -c | sort -rn | head -40
          echo "--- letzte Zeilen"; tail -15 "$f"
          echo "--- Zeilen mit 2026"; grep -i "2026" "$f" | head -30
