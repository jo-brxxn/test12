name: Probe NZ core CPI sources

# Einmal-Probe 2026-10-27, schreibt nichts ins Repo: voller Pfad und Aufbau
# der Stats-NZ-Datei "tradeables-and-non-tradeables.csv" (Non-tradables-CPI).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Stats NZ CSV
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -m 30 "https://www.stats.govt.nz/information-releases/consumers-price-index-september-2026-quarter/" -o s.html
          grep -o '.\{260\}tradeables-and-non-tradeables.csv.\{80\}' s.html | head -3
          P=$(grep -o '[^"'"'"' (]*tradeables-and-non-tradeables\.csv' s.html | head -1)
          echo "PFAD: $P"
          case "$P" in http*) U="$P";; /*) U="https://www.stats.govt.nz$P";; *) U="https://www.stats.govt.nz/$P";; esac
          curl -sL -A "$UA" -m 30 -w "\nHTTP %{http_code} %{size_download}B %{url_effective}\n" "$U" -o t.csv | tail -1
          echo "--- Kopf"; head -5 t.csv
          echo "--- Spalte 1-4 Werte"; awk -F, 'NR>1{print $1","$2","$3","$4}' t.csv | sort -u | head -40
          echo "--- letzte Zeilen"; tail -12 t.csv
          echo "--- Juni-Datei (Vorquartal)"
          U2=$(echo "$U" | sed 's/september-2026/june-2026/g; s/September-2026/June-2026/g')
          curl -sL -A "$UA" -m 30 -o /dev/null -w "HTTP %{http_code} %{size_download}B $U2\n" "$U2"
