# Sonde: EUR Job Vacancy Rate aus Eurostat (tools/stellen.mjs --probe) - schreibt NICHTS.
# Anlass: Nutzer-Foto 2026-11-22 "Job vacancies ist irgendwie kaputt und hat keine Historie".
name: Probe EUR job vacancy (Eurostat)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Katalog nach Job-Vacancy-Datensaetzen durchsuchen
        run: |
          curl -sL --max-time 120 -o toc.txt "https://ec.europa.eu/eurostat/api/dissemination/catalogue/toc/txt?lang=en" || true
          echo "=== TOC $(wc -c < toc.txt) Bytes"; grep -i "vacanc" toc.txt | head -30
          grep -io -E "\"(jvs|ei_lmjv)[a-z0-9_]*\"" toc.txt | sort -u | tr -d '"' > ids.txt; cat ids.txt
          head -c 300 toc.txt; echo
          curl -sL --max-time 120 -o flows.xml "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/dataflow/ESTAT/all?detail=allstubs" || true
          echo "=== Katalog $(wc -c < flows.xml) Bytes"; head -c 300 flows.xml; echo
          python3 - <<'PY'
          import re
          t=open('flows.xml',errors='ignore').read()
          for m in re.finditer(r'<s:Dataflow[^>]*id="([^"]+)"[^>]*>(.*?)</s:Dataflow>',t,re.S):
              name=' '.join(re.findall(r'<c:Name[^>]*xml:lang="en"[^>]*>([^<]*)</c:Name>',m.group(2)))
              if re.search(r'vacanc',name,re.I) or m.group(1).lower().startswith(('jvs','ei_lmjv')): print('   ',m.group(1),'|',name)
          PY
      - name: Abfrage je gefundenem Datensatz
        run: |
          B="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
          curl -sL --max-time 120 -o toc.txt "https://ec.europa.eu/eurostat/api/dissemination/catalogue/toc/txt?lang=en" || true
          for D in $(grep -io -E '"(jvs|ei_lmjv)[a-z0-9_]*"' toc.txt | sort -u | tr -d '"'); do
            CODE=$(curl -sL -o v.json -w "%{http_code}" --max-time 60 "$B/$D?format=JSON&lang=EN&geo=EA20&sinceTimePeriod=2024-Q1" || echo 000)
            echo "=== $CODE $(wc -c < v.json) $D"
            python3 - <<'PY' || head -c 300 v.json
          import json
          j=json.load(open('v.json'))
          if 'id' not in j: print(json.dumps(j)[:300]); raise SystemExit
          print('   updated',j.get('updated'),'size',j['size'])
          for d in j['id']:
              c=list(j['dimension'][d]['category']['index'].keys())
              print('     ',d,len(c),c[:14] if d!='time' else c[-6:])
          PY
          done
