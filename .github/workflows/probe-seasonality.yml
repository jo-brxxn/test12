name: Probe seasonality sources

# Einmal-Probe 2026-10-27, schreibt nichts ins Repo.
# 1) Reproduktion: NZD (NZDUSD=X) und DAX (^GDAXI) fehlen seit 25.10. in
#    seasonality_data.json (Ende der Sommerzeit). Alte Monatszuordnung
#    (aktueller gmtoffset fuer alle Bars) gegen Zuordnung in der Boersen-
#    Zeitzone (Intl, je Bar die damals gueltige Sommer-/Winterzeit).
# 2) Was liefert Yahoo fuer alle 28 FX-Paare, ETH und US-Renditen?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and compare
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL --max-time 15 -A "$UA" -c yc.txt "https://fc.yahoo.com" -o /dev/null || true
          CRUMB=$(curl -sL --max-time 15 -A "$UA" -b yc.txt -c yc.txt "https://query2.finance.yahoo.com/v1/test/getcrumb")
          for SYM in NZDUSD%3DX %5EGDAXI FXE UUP ETH-USD %5ETNX %5EFVX %5EIRX \
            EURUSD%3DX GBPUSD%3DX AUDUSD%3DX USDJPY%3DX USDCHF%3DX USDCAD%3DX \
            EURGBP%3DX EURJPY%3DX EURCHF%3DX EURAUD%3DX EURNZD%3DX EURCAD%3DX \
            GBPJPY%3DX GBPCHF%3DX GBPAUD%3DX GBPNZD%3DX GBPCAD%3DX \
            AUDJPY%3DX AUDNZD%3DX AUDCAD%3DX AUDCHF%3DX NZDJPY%3DX NZDCHF%3DX NZDCAD%3DX \
            CADJPY%3DX CADCHF%3DX CHFJPY%3DX; do
            curl -sL --max-time 30 -A "$UA" -b yc.txt "https://query1.finance.yahoo.com/v8/finance/chart/${SYM}?range=20y&interval=1mo&crumb=${CRUMB}" -o "p_${SYM}.json" || true
            sleep 0.3
          done
          node -e '
            const fs=require("fs");
            const YEARS=15,cutoff=new Date();cutoff.setUTCFullYear(cutoff.getUTCFullYear()-YEARS);
            for(const f of fs.readdirSync(".").filter(f=>/^p_.*\.json$/.test(f)).sort()){
              const sym=decodeURIComponent(f.slice(2,-5));
              let r;try{r=JSON.parse(fs.readFileSync(f,"utf8")).chart.result[0];}catch(e){console.log(sym.padEnd(10)," FEHLT ("+fs.readFileSync(f,"utf8").slice(0,80)+")");continue;}
              const ts=r.timestamp||[],cl=(r.indicators.quote[0]||{}).close||[],m=r.meta||{};
              const tz=m.exchangeTimezoneName,off=m.gmtoffset||0;
              const monAlt=t=>new Date((t+off)*1000).getUTCMonth()+1;
              const fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz||"UTC",year:"numeric",month:"numeric"});
              const monNeu=t=>+fmt.formatToParts(new Date(t*1000)).find(p=>p.type==="month").value;
              const zaehl=fn=>{const by={};let prev=null;for(let i=0;i<ts.length;i++){const c=cl[i];if(c==null||!(c>0))continue;const d=new Date(ts[i]*1000);if(prev!=null&&d>=cutoff){const k=fn(ts[i]);by[k]=(by[k]||0)+1;}prev=c;}return by;};
              const a=zaehl(monAlt),n=zaehl(monNeu);
              const kurz=by=>Object.keys(by).length+" Monate, min "+Math.min(...Object.values(by))+"/max "+Math.max(...Object.values(by));
              const erster=ts.length?new Date(ts[0]*1000).toISOString().slice(0,10):"-";
              console.log(sym.padEnd(10),"tz="+tz,"off="+off,"bars="+ts.length,"ab "+erster,"| alt: "+kurz(a),"| neu: "+kurz(n),"| erste Stempel "+ts.slice(0,3).map(t=>new Date(t*1000).toISOString().slice(5,16)).join(","));
            }
          '
