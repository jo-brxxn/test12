name: Probe TE pages (dates + NZ core inflation)

# Einmal-Probe 2026-10-27, liest nichts in die App ein.
# 1) Woher nimmt der TE-Laenderseiten-Pfad sein Release-Datum? Gibt jede
#    Datumsangabe der Seite mit Umgebung aus (Messung statt Vermutung,
#    CLAUDE.md Regel 8) - Anlass: woechentliche Scheinpunkte gleichen Werts.
# 2) Fuehrt TE eine NZ-Kerninflation, und welche Reihe ist es?
# 3) Stats NZ / RBNZ: was liefern sie dem Runner (Titel der Antwort)?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          while IFS='|' read -r key path; do
            [ -z "$key" ] && continue
            curl -sL -A "$UA" -m 25 "https://tradingeconomics.com/$path" -o "te_$key.html" || true
            sleep 1
          done <<'URLS'
          nzcore|new-zealand/core-inflation-rate
          cadsvc|canada/services-pmi
          jpygdp|japan/gdp-growth
          eurmfg|euro-area/manufacturing-pmi
          audcore|australia/core-inflation-rate
          chfcore|switzerland/core-inflation-rate
          jpyemp|japan/employed-persons
          URLS
          curl -sL -A "$UA" -m 25 "https://www.stats.govt.nz/information-releases/consumers-price-index-september-2026-quarter/" -o statsnz.html || true
      - name: Inspect
        run: |
          node -e '
            const fs=require("fs");
            const strip=h=>h.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ");
            const sq=s=>s.replace(/\s+/g," ");
            for(const f of fs.readdirSync(".").filter(f=>/^te_.*\.html$/.test(f)).sort()){
              const h=fs.readFileSync(f,"utf8");
              console.log("\n===== "+f);
              const desc=/"description":\s*"([^"]{0,400})/.exec(h);console.log("DESC: "+(desc?desc[1]:"-"));
              const md=/<meta[^>]+name="description"[^>]+content="([^"]{0,400})/i.exec(h);console.log("META: "+(md?md[1]:"-"));
              // Kalenderzeilen roh
              const rows=h.match(/<tr[^>]*data-category[\s\S]*?<\/tr>/gi)||[];
              console.log("KALENDERZEILEN: "+rows.length);
              rows.slice(0,4).forEach((r,i)=>console.log("ROW"+i+" RAW: "+sq(r).slice(0,900)));
              rows.slice(0,6).forEach((r,i)=>console.log("ROW"+i+" TXT: "+strip(r)));
              // Stream-Eintraege roh (600 Zeichen vor jedem Datum)
              const re=/te-stream-date[^>]*>([^<]*)</g;let m,n=0;
              while((m=re.exec(h))&&n<4){n++;console.log("STREAM"+n+" "+m[1]+" TXT: "+strip(h.slice(Math.max(0,m.index-900),m.index)).slice(-420));}
              if(n){const r0=/te-stream-date/.exec(h);console.log("STREAM RAW: "+sq(h.slice(Math.max(0,r0.index-1500),r0.index+200)).slice(0,1700));}
            }
            let h="";try{h=fs.readFileSync("statsnz.html","utf8");}catch(e){}
            const t=strip(h);
            console.log("\n===== statsnz ("+h.length+" B)");
            const re=/[^.]{0,260}(?:tradab|tradeab|non-trad|core|excluding food)[^.]{0,260}\./gi;let m,n=0;
            while((m=re.exec(t))&&n<12){n++;console.log("NZ "+n+": "+m[0].trim());}
            const k=t.search(/key facts/i);console.log("KEYFACTS: "+(k>=0?t.slice(k,k+1500):"-"));
          '
