name: Probe TE pages (dates + NZ core inflation)

# Einmal-Probe 2026-10-27, liest nichts in die App ein.
# 1) Woher nimmt der TE-Laenderseiten-Pfad sein Release-Datum? Gibt jede
#    Datumsangabe der Seite mit Umgebung aus (Messung statt Vermutung,
#    CLAUDE.md Regel 8) - Anlass: woechentliche Scheinpunkte gleichen Werts.
# 2) Fuehrt TE eine NZ-Kerninflation, und welche Reihe ist es?
# 3) Stats NZ / RBNZ: was liefern sie dem Runner (Titel der Antwort)?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sL -A "$UA" -m 25 "https://www.stats.govt.nz/information-releases/consumers-price-index-september-2026-quarter/" -o statsnz.html || true
      - name: Inspect
        run: |
          node -e '
            const fs=require("fs");
            const h=fs.readFileSync("statsnz.html","utf8");
            const strip=x=>x.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ");
            const t=strip(h);
            console.log("LEN "+h.length+" TEXT "+t.length);
            console.log("TEXT: "+t.slice(0,3000));
            const links=[...h.matchAll(/href="([^"]+)"/g)].map(m=>m[1]).filter(u=>/csv|xlsx|download|assets\/uploads/i.test(u));
            console.log("LINKS: "+[...new Set(links)].join("\n"));
          '
          for u in $(node -e 'const h=require("fs").readFileSync("statsnz.html","utf8");console.log([...new Set([...h.matchAll(/href="([^"]+\.csv)"/gi)].map(m=>m[1]))].slice(0,3).join(" "))'); do
            case "$u" in http*) url="$u";; *) url="https://www.stats.govt.nz$u";; esac
            echo "== $url"; curl -sL -A "Mozilla/5.0" -m 30 "$url" -o d.csv || true
            echo "bytes $(wc -c <d.csv)"; head -3 d.csv; grep -i -m5 "non-trad\|nontrad" d.csv | head -5
            awk -F, 'NR>1{print $1}' d.csv | sort | uniq -c | sort -rn | head -5
          done
