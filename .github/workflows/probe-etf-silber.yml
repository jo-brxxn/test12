# Welche Quelle liefert die Silber-ETF-Bestaende (Zu-/Abfluesse) - aktuell UND Historie?
#
# Anlass (Nutzer 2026-11-22): "find eine Quelle fuer die etf Zufluesse" (Silber-Score).
# Gesucht: Bestand in Unzen bzw. ausstehende Anteile (Creations/Redemptions) taeglich.
#   A) iShares SLV: Bestandsliste (CSV) und Fonds-Datei mit Historie (Shares Outstanding je Tag)
#   B) Sprott PSLV: Fondsseite (Unzen im Trust)
#   C) abrdn SIVR: Fondsseite
# ⚠ Dieser Lauf schreibt NICHTS in die Daten: HTTP-Code, Groesse, Fundstellen. Erst danach wird gebaut.
name: Probe silver ETF sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A) iShares SLV
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          B="https://www.ishares.com/us/products/239855/ishares-silver-trust-fund"
          echo "## A) iShares SLV" >> $GITHUB_STEP_SUMMARY
          for U in "$B" "$B/1467271812596.ajax?fileType=csv&fileName=SLV_holdings&dataType=fund" "$B/1467271812596.ajax?fileType=xls&fileName=iShares-Silver-Trust_fund&dataType=fund"; do
            CODE=$(curl -sL -o a.out -w "%{http_code}" --max-time 60 -A "$UA" "$U" || echo 000)
            SZ=$(wc -c < a.out 2>/dev/null || echo 0)
            echo "- HTTP $CODE, $SZ Bytes: \`$U\`" >> $GITHUB_STEP_SUMMARY
            echo "=== $CODE $SZ $U"; head -c 1500 a.out | tr -d '\r' | head -40; echo
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -io -E "(ounces|shares outstanding|tonnes)[^<]{0,120}" a.out | head -8 >> $GITHUB_STEP_SUMMARY || true
            grep -c -E "<ss:Row|<Row" a.out >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            cp a.out "slv_$(echo $U | md5sum | cut -c1-6).out"
          done
          # Historie in der Fonds-Datei (SpreadsheetML): Zeilen mit Datum + Shares Outstanding zaehlen
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY || true
          import glob,re
          for f in glob.glob('slv_*.out'):
              t=open(f,errors='ignore').read()
              rows=re.findall(r'<ss:Row>(.*?)</ss:Row>',t,re.S)
              if not rows: continue
              print(f'\n{f}: {len(rows)} Zeilen (SpreadsheetML)')
              for r in rows[:3]+rows[-3:]:
                  print('  ',' | '.join(re.sub(r'<[^>]+>','',c).strip() for c in re.findall(r'<ss:Cell.*?</ss:Cell>',r,re.S))[:200])
          PY
      - name: B) Sprott PSLV + C) abrdn SIVR
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "## B/C) Sprott PSLV, abrdn SIVR" >> $GITHUB_STEP_SUMMARY
          for U in "https://sprott.com/investment-strategies/physical-commodity-funds/silver/" "https://www.abrdn.com/en-us/investor/fund-centre/etfs/abrdn-silver-etf-trust-sivr"; do
            CODE=$(curl -sL -o b.out -w "%{http_code}" --max-time 60 -A "$UA" "$U" || echo 000)
            SZ=$(wc -c < b.out 2>/dev/null || echo 0)
            echo "- HTTP $CODE, $SZ Bytes: \`$U\`" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -io -E "(ounces|oz)[^<]{0,100}" b.out | head -6 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
